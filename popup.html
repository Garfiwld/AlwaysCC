<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlwaysCC</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      padding: 10px;
      background-color: #f9f9f9;
    }
    h1 {
      font-size: 16px;
      color: #c00;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .status {
      margin-top: 10px;
      font-style: italic;
      color: #080;
    }
    .footer {
      font-size: 11px;
      color: #666;
      margin-top: 15px;
      text-align: center;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      font-style: italic;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .toggle-row label {
      margin-bottom: 0;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .2s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #c00;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
  </style>
</head>
<body>
  <h1>AlwaysCC</h1>

  <div class="toggle-row">
    <label for="enabled-toggle">Enable AlwaysCC</label>
    <label class="switch">
      <input type="checkbox" id="enabled-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="form-group">
    <label for="subtitle-preference">Preferred Subtitle:</label>
    <select id="subtitle-preference"></select>
  </div>

  <div class="status" id="status"></div>

  <div class="note">
    <p>Note: AlwaysCC tries an auto-generated caption in this language first, then falls back to auto-translate if one isn't available.</p>
  </div>

  <div class="footer">
    <p>Version 1.1 - Chrome & Firefox</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
